name: Test read-only MCP adapter
on:
  push:
    paths:
      - 'mcp_server/**'
      - 'requirements-mcp.txt'
      - 'tests/mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp_server/**'
      - 'requirements-mcp.txt'
      - 'tests/mcp/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-mcp.txt
      - name: Test registry evidence and rights gates
        run: python -m unittest discover -s tests/retrieval -p "test_mcp_registry.py" -v
      - name: Test stdio MCP handshake and read-only tools
        run: python -m unittest discover -s tests/mcp -v
