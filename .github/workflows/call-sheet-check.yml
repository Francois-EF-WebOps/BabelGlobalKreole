name: Manual call-sheet backend checks

on:
  push:
    branches:
      - feat/seven-post-approval-queue
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run call-sheet acceptance tests
        run: pytest -q scripts/test_call_sheet.py
      - name: Build operator-local daily call sheet
        run: |
          python scripts/build_call_sheet.py --output /tmp/today.md
          test -s /tmp/today.md
          grep -Fq "manual only" /tmp/today.md
      - name: Upload daily call sheet for phone review
        uses: actions/upload-artifact@v4
        with:
          name: manual-call-sheet
          path: /tmp/today.md
          retention-days: 7
