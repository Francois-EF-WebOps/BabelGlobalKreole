name: Validate framework records
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate schemas, records, and provenance
        run: python scripts/validate_records.py
      - name: Check tracked files and URL hygiene
        run: python scripts/validation_checks.py --repository
      - name: Check JSONL integrity
        run: python scripts/validation_checks.py --jsonl
      - name: Check unfinished drafting markers in maintained prose
        run: python scripts/validation_checks.py --drafts
      - name: Check internal Markdown links
        run: python scripts/check_internal_links.py
      - name: Test validation-check regressions
        run: python -m unittest discover -s tests/validation -v
      - name: Test offline retrieval demo
        run: python -m unittest discover -s tests/retrieval -v
      - name: Verify catalog is current
        run: |
          python scripts/generate_catalog.py
          git diff --exit-code -- catalog.json
