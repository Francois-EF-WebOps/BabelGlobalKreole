name: Validate framework records
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_records.py
      - name: no_placeholders
        run: python scripts/no_placeholders_check.py
      - name: test offline retrieval demo
        run: python -m unittest discover -s tests/retrieval -v
      - name: verify catalog is current
        run: |
          python scripts/generate_catalog.py
          git diff --exit-code -- catalog.json
